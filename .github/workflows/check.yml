name: Check

on:
  workflow_dispatch:
  push:
    branches:
      - agent/wasm-boundary-validation-v13

permissions:
  contents: write

concurrency:
  group: wasm-boundary-v13-dispatch
  cancel-in-progress: true

env:
  DENO_VERSION: 2.9.4
  CARGO_TERM_COLOR: always
  TARGET_BRANCH: agent/wasm-boundary-v3
  TRANSFORM_BRANCH: agent/rs-gate-validation

jobs:
  validate:
    name: WASM boundary v3.13
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 180
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Prepare validation run
        shell: bash
        run: |
          set -euo pipefail
          git config --local user.name trellis-validation
          git config --local user.email trellis-validation@users.noreply.github.com
          git config --local commit.gpgsign false
          git config --local tag.gpgSign false
          printf '%s\n' "$GITHUB_RUN_ID" > .validation-run
          test -s .validation-run

      - name: Load scratch validator
        uses: actions/checkout@v4
        with:
          ref: agent/wasm-boundary-validation-v13
          path: .agent-validator
          fetch-depth: 1

      - name: Detach validator from candidate tree
        shell: bash
        run: |
          set -euo pipefail
          cp .agent-validator/scripts/agent_run_wasm_boundary_v13.sh /tmp/agent-run-wasm-boundary-v13.sh
          rm -rf .agent-validator
          test -f /tmp/agent-run-wasm-boundary-v13.sh
          git status --short

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt,clippy

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.24.x

      - name: Validate candidate
        shell: bash
        run: bash /tmp/agent-run-wasm-boundary-v13.sh
