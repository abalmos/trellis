name: Check

on:
  workflow_dispatch:
  push:
    branches:
      - rs
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DENO_VERSION: 2.9.4
  CARGO_TERM_COLOR: always
  RUSTUP_INIT_SKIP_PATH_CHECK: "yes"

jobs:
  prepare:
    name: Prepare generated artifacts
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    outputs:
      current: ${{ steps.current.outputs.current }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Expose installed Cargo binaries
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Expose Rust toolchain binaries
        run: echo "$(dirname "$(rustup which rustfmt)")" >> "$GITHUB_PATH"

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Cache preparation build
        uses: swatinem/rust-cache@v2
        env:
          CARGO_HOME: ${{ runner.temp }}/trellis-prepare-cargo-home
          CARGO_TARGET_DIR: ${{ runner.temp }}/trellis-prepare-target
        with:
          workspaces: |
            rust/tools/generate -> target
            rust/xtask -> target

      - name: Prepare generated artifacts
        env:
          CARGO_HOME: ${{ runner.temp }}/trellis-prepare-cargo-home
          CARGO_TARGET_DIR: ${{ runner.temp }}/trellis-prepare-target
        run: cargo run --manifest-path rust/xtask/Cargo.toml -- prepare

      - name: Inspect generated artifact drift
        id: current
        shell: bash
        run: |
          if git diff --quiet; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi

      - name: Upload prepared artifacts
        uses: actions/upload-artifact@v4
        with:
          name: check-generated
          path: generated
          retention-days: 1

  generated:
    name: Generated artifacts current
    needs: prepare
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: Require generated artifacts to be current
        env:
          GENERATED_CURRENT: ${{ needs.prepare.outputs.current }}
        run: test "$GENERATED_CURRENT" = true

  wasm:
    name: Protocol WASM
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Expose installed Cargo binaries
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache protocol WASM build
        uses: swatinem/rust-cache@v2
        env:
          CARGO_HOME: ${{ runner.temp }}/trellis-wasm-cargo-home
          CARGO_TARGET_DIR: ${{ runner.temp }}/trellis-wasm-target
        with:
          workspaces: |
            rust -> target
            rust/xtask -> target

      - name: Build protocol WASM
        env:
          CARGO_HOME: ${{ runner.temp }}/trellis-wasm-cargo-home
          CARGO_TARGET_DIR: ${{ runner.temp }}/trellis-wasm-target
        run: |
          rm -rf generated
          cargo run --manifest-path rust/xtask/Cargo.toml -- protocol-wasm

      - name: Upload protocol WASM
        uses: actions/upload-artifact@v4
        with:
          name: check-protocol-wasm
          path: ts/packages/trellis/auth/protocol_wasm
          retention-days: 1

  portal:
    name: Embedded login portal
    needs: prepare
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download generated artifacts
        uses: actions/download-artifact@v4
        with:
          name: check-generated
          path: generated

      - name: Download protocol WASM
        uses: actions/download-artifact@v4
        with:
          name: check-protocol-wasm
          path: ts/packages/trellis/auth/protocol_wasm

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Build embedded portal
        run: deno task -c ts/portals/login/deno.json build:embedded

      - name: Upload embedded portal
        uses: actions/upload-artifact@v4
        with:
          name: check-portal
          path: rust/crates/runtime/generated/portal
          retention-days: 1

  rust:
    name: Rust
    needs: [prepare, portal]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download generated artifacts
        uses: actions/download-artifact@v4
        with:
          name: check-generated
          path: generated

      - name: Download embedded portal
        uses: actions/download-artifact@v4
        with:
          name: check-portal
          path: rust/crates/runtime/generated/portal

      - name: Expose installed Cargo binaries
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Expose Rust toolchain binaries
        run: echo "$(dirname "$(rustup which rustfmt)")" >> "$GITHUB_PATH"

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            rust -> target
            rust/tools/generate -> target
            rust/xtask -> target
            xtask -> target

      - name: Check formatting
        run: |
          cargo fmt --manifest-path rust/Cargo.toml --all --check
          cargo fmt --manifest-path rust/tools/generate/Cargo.toml --check
          cargo fmt --manifest-path rust/xtask/Cargo.toml --check

      - name: Lint production Rust
        run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets -- -D warnings

      - name: Test Rust libraries
        run: cargo test --manifest-path rust/Cargo.toml --workspace --lib

      - name: Test Rust tooling
        run: |
          cargo test --manifest-path rust/tools/generate/Cargo.toml
          cargo test --manifest-path rust/xtask/Cargo.toml
          cargo test --manifest-path xtask/Cargo.toml

  typescript:
    name: TypeScript
    needs: [prepare, wasm]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download generated artifacts
        uses: actions/download-artifact@v4
        with:
          name: check-generated
          path: generated

      - name: Download protocol WASM
        uses: actions/download-artifact@v4
        with:
          name: check-protocol-wasm
          path: ts/packages/trellis/auth/protocol_wasm

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Check formatting
        run: deno fmt -c ts/deno.json --check

      - name: Check TypeScript packages
        run: >-
          deno check -c ts/deno.json
          ts/packages/trellis/index.ts
          ts/packages/trellis-svelte/src/index.ts
          ts/packages/trellis-svelte/src/context.svelte.ts
          ts/packages/trellis-test/index.ts

      - name: Test TypeScript packages
        run: deno task -c ts/deno.json test:prepared

      - name: Check live runners
        run: >-
          deno check -c ts/deno.json
          integration/live_runner.ts
          rust/crates/trellis-test/integration_runner.ts

      - name: Test live runners
        run: >-
          deno test -A -c ts/deno.json
          integration/live_runner_test.ts
          rust/crates/trellis-test/integration_runner_test.ts

  live-build:
    name: Build live executables
    needs: [prepare, wasm, portal]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download generated artifacts
        uses: actions/download-artifact@v4
        with:
          name: check-generated
          path: generated

      - name: Download embedded portal
        uses: actions/download-artifact@v4
        with:
          name: check-portal
          path: rust/crates/runtime/generated/portal

      - name: Download protocol WASM
        uses: actions/download-artifact@v4
        with:
          name: check-protocol-wasm
          path: ts/packages/trellis/auth/protocol_wasm

      - name: Expose installed Cargo binaries
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Build live executables
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/trellis-live-target
        run: deno run -A -c ts/deno.json integration/live_runner.ts --build-only

      - name: Upload live executables
        uses: actions/upload-artifact@v4
        with:
          name: check-live-executables
          path: dist/integration-runtime
          retention-days: 1

  live:
    name: Live ${{ matrix.name }}
    needs: [live-build]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    env:
      # Eight runner services share the 192-core host; each job runs both languages.
      TRELLIS_INTEGRATION_JOBS: "4"
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - name: auth
            rust: "auth::"
            typescript: "authorization-registry."
          - name: operations
            rust: "operations::"
            typescript: "operations."
          - name: state
            rust: "state::"
            typescript: "state."
          - name: event-consumers
            rust: "event_consumers::"
            typescript: ""
          - name: jobs
            rust: "jobs::"
            typescript: ""
          - name: rpc
            rust: "rpc::"
            typescript: "rpc."
          - name: resources
            rust: "resources::"
            typescript: "resources."
          - name: transfer
            rust: "transfer::"
            typescript: "transfer."
          - name: events
            rust: "events::"
            typescript: "events."
          - name: feeds
            rust: "feeds::"
            typescript: "feeds."
          - name: prepared-events
            rust: "prepared_events::"
            typescript: "outbox."
          - name: authority-plan
            rust: "authority_plan::"
            typescript: ""
          - name: health
            rust: "health::"
            typescript: ""
          - name: runtime-ownership
            rust: "runtime_ownership::"
            typescript: ""
          - name: cli
            rust: "cli::"
            typescript: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download generated artifacts
        uses: actions/download-artifact@v4
        with:
          name: check-generated
          path: generated

      - name: Download protocol WASM
        uses: actions/download-artifact@v4
        with:
          name: check-protocol-wasm
          path: ts/packages/trellis/auth/protocol_wasm

      - name: Download live executables
        uses: actions/download-artifact@v4
        with:
          name: check-live-executables
          path: dist/integration-runtime

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Run live integration suite
        env:
          RUST_FILTER: ${{ matrix.rust }}
          TYPESCRIPT_PREFIX: ${{ matrix.typescript }}
        shell: bash
        run: |
          args=(--prebuilt-only --rust-filter "$RUST_FILTER")
          if [[ -n "$TYPESCRIPT_PREFIX" ]]; then
            args+=(--typescript-prefix "$TYPESCRIPT_PREFIX")
          else
            args+=(--rust-only)
          fi
          deno run -A -c ts/deno.json integration/live_runner.ts "${args[@]}"

  external-smoke:
    name: External repository smoke
    needs: [prepare, wasm, live-build]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download generated artifacts
        uses: actions/download-artifact@v4
        with:
          name: check-generated
          path: generated

      - name: Download protocol WASM
        uses: actions/download-artifact@v4
        with:
          name: check-protocol-wasm
          path: ts/packages/trellis/auth/protocol_wasm

      - name: Download live executables
        uses: actions/download-artifact@v4
        with:
          name: check-live-executables
          path: dist/integration-runtime

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Run external repository smoke
        env:
          TRELLIS_TEST_SERVER_BIN: ${{ github.workspace }}/dist/integration-runtime/trellis-server
        run: >-
          chmod +x dist/integration-runtime/trellis-server &&
          deno run -A -c ts/deno.json
          ts/packages/trellis-test/src/integration/runner.ts
          --config
          ts/packages/trellis-test/tests/fixtures/external-service-repo/trellis.integration.ts
          --case external.rpc-smoke
