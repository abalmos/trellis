name: Agent fault cleanup v2

on:
  push:
    branches:
      - agent/rs-fault-cleanup

permissions:
  contents: write

jobs:
  edit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rs-fault-cleanup
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Remove synthetic provider failures
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import json
          import re

          def exact(text, old, new='', count=1):
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"expected {count} occurrence(s), found {actual}: {old[:100]!r}")
              return text.replace(old, new)

          provider_path = Path('rust/crates/trellis/src/client/authorization/provider_cache.rs')
          provider = provider_path.read_text()
          provider = exact(provider, '#[cfg(feature = "integration-test-scoping")]\nuse std::sync::atomic::AtomicBool;\n')
          provider = exact(provider, '    #[cfg(feature = "integration-test-scoping")]\n    fail_next_context_read: Arc<AtomicBool>,\n    #[cfg(feature = "integration-test-scoping")]\n    fail_next_readiness_check: Arc<AtomicBool>,\n')
          provider = exact(provider, '            #[cfg(feature = "integration-test-scoping")]\n            fail_next_context_read: Arc::new(AtomicBool::new(false)),\n            #[cfg(feature = "integration-test-scoping")]\n            fail_next_readiness_check: Arc::new(AtomicBool::new(false)),\n', count=3)
          provider, n = re.subn(
              r'    /// Fail the next exact context registry read for live redelivery coverage\.\n.*?\n    fn set_healthy',
              '    fn set_healthy',
              provider,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit(f'expected provider synthetic-method block once, found {n}')
          provider = exact(provider, '        #[cfg(feature = "integration-test-scoping")]\n        if self.fail_next_context_read.swap(false, Ordering::Relaxed) {\n            return Err(TrellisClientError::NatsRequest(\n                "injected authorization context read failure".into(),\n            ));\n        }\n')
          provider_path.write_text(provider)

          validator_path = Path('rust/crates/trellis/src/service/local_validator.rs')
          validator = validator_path.read_text()
          validator = exact(validator, '        #[cfg(feature = "integration-test-scoping")]\n        if provider.integration_test_take_readiness_failure() {\n            return Err(EventVerificationFailure::retryable(format!(\n                "local authorization context unavailable for {subject}"\n            )));\n        }\n')
          validator_path.write_text(validator)

          events_path = Path('rust/crates/trellis/tests/integration/event_consumers.rs')
          events = events_path.read_text()
          events = exact(events, 'event_consumers_authorization_failures_redeliver_or_term', 'event_consumers_invalid_authorization_proof_terms_event')
          events = exact(events, 'event-consumers.authorization-failures-redeliver-or-term', 'event-consumers.invalid-authorization-proof-terms-event')
          events = exact(events, '    let provider = consumer.integration_test_authorization_provider();\n')
          events, n = re.subn(
              r'    let publisher = admin\n        \.connect_client\(&bootstrap_url, &publisher_contract\(\)\)\n        \.await\n        \.expect\("connect first event publisher"\);\n    provider\.integration_test_fail_next_readiness_check\(\);\n    publisher\n        \.publish::<SourcePingedEvent>\(&EventRecord \{\n            id: "rust-event-auth-not-ready"\.into\(\),\n            value: "retry"\.into\(\),\n        \}\)\n        \.await\n        \.expect\("publish while provider is unready"\);\n    wait_for_ack_payload\(&ack_observer, &durable_name, "-NAK"\)\.await;\n    wait_for_observed_vec_id\(&observed, "rust-event-auth-not-ready"\)\.await;\n\n',
              '',
              events,
          )
          if n != 1:
              raise SystemExit(f'expected readiness-injection block once, found {n}')
          events = exact(events, '    provider.integration_test_fail_next_context_read();\n')
          events = exact(events, '    assert_eq!(observed.lock().await.len(), 2);', '    assert_eq!(observed.lock().await.len(), 1);')
          events_path.write_text(events)

          matrix_path = Path('integration/rust-runtime-test-matrix.json')
          matrix = json.loads(matrix_path.read_text())
          old_id = 'event-consumers.authorization-failures-redeliver-or-term'
          new_id = 'event-consumers.invalid-authorization-proof-terms-event'
          cases = matrix.get('cases', [])
          matches = [case for case in cases if case.get('id') == old_id]
          if len(matches) != 1:
              raise SystemExit(f'expected one matrix case {old_id}, found {len(matches)}')
          case = matches[0]
          case['id'] = new_id
          case['title'] = 'Invalid authorization proofs terminate durable events'
          case['description'] = 'A durable event carrying an invalid authorization proof is permanently terminated without invoking the handler.'
          if isinstance(case.get('coverage'), list):
              case['coverage'] = ['authorization', 'term']
          for key, value in {
              'given': 'A connected durable event consumer and a valid signed event.',
              'when': 'The same event payload is published with an invalid authorization proof.',
              'then': 'The invalid event is permanently terminated without another handler invocation.',
          }.items():
              if key in case:
                  case[key] = value

          def replace_function(value):
              if isinstance(value, dict):
                  return {k: replace_function(v) for k, v in value.items()}
              if isinstance(value, list):
                  return [replace_function(v) for v in value]
              if value == 'event_consumers_authorization_failures_redeliver_or_term':
                  return 'event_consumers_invalid_authorization_proof_terms_event'
              return value

          matrix = replace_function(matrix)
          matrix_path.write_text(json.dumps(matrix, indent=2) + '\n')

          for path in [provider_path, validator_path, events_path]:
              text = path.read_text()
              for forbidden in ['fail_next_context_read', 'fail_next_readiness', 'injected authorization context read failure']:
                  if forbidden in text:
                      raise SystemExit(f'{forbidden!r} remains in {path}')
          PY

      - name: Format and compile
        shell: bash
        run: |
          set -euo pipefail
          rustfmt --edition 2021 \
            rust/crates/trellis/src/client/authorization/provider_cache.rs \
            rust/crates/trellis/src/service/local_validator.rs \
            rust/crates/trellis/tests/integration/event_consumers.rs
          cargo run --manifest-path rust/tools/generate/Cargo.toml -- prepare --no-npm .
          cargo check --manifest-path rust/Cargo.toml -p trellis-rs --all-targets --features integration-test-scoping
          git diff --check

      - name: Commit verified cleanup
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/agent-fault-cleanup.yml .github/workflows/agent-fault-cleanup-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/crates/trellis/src/client/authorization/provider_cache.rs \
            rust/crates/trellis/src/service/local_validator.rs \
            rust/crates/trellis/tests/integration/event_consumers.rs \
            integration/rust-runtime-test-matrix.json
          git commit -m "Remove synthetic provider fault injection"
          git push origin HEAD:agent/rs-fault-cleanup
