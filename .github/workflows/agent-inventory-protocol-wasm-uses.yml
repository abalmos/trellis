name: Inventory protocol WASM uses

on:
  push:
    branches: [agent/inventory-protocol-wasm-uses-v1]

permissions:
  contents: write

jobs:
  inventory:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          {
            echo '## imports'
            git grep -n -E 'from ["'"'].*protocol_wasm|import\(.*protocol_wasm' -- ts || true
            echo '## exported helper uses'
            git grep -n -E 'resolveParticipantV1WasmSync|sessionProof(RequestDigest|SigningDigest|Verify)Wasm|verifyAuthorization(Context|Manifest|Request|Event).*Wasm|protocolWasmSync' -- ts || true
          } > .protocol-wasm-uses
          git config user.name trellis-validation
          git config user.email actions@users.noreply.github.com
          git add .protocol-wasm-uses
          git commit -m 'Record protocol WASM use inventory'
          git push --force origin HEAD:refs/heads/agent/result-protocol-wasm-uses-v1
