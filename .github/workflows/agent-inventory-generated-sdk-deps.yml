name: Inventory generated SDK Rust deps

on:
  push:
    branches: [agent/inventory-generated-sdk-deps-v1]

permissions:
  contents: write

jobs:
  inventory:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          git grep -n -E 'trellis-sdk-[a-z-]+' -- 'rust/**/Cargo.toml' > .generated-sdk-deps || true
          git config user.name trellis-validation
          git config user.email actions@users.noreply.github.com
          git add .generated-sdk-deps
          git commit -m 'Record generated SDK dependency inventory'
          git push --force origin HEAD:refs/heads/agent/result-generated-sdk-deps-v1
