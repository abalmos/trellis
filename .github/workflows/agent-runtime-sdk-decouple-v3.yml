name: Validate runtime generated SDK decoupling v3

on:
  push:
    branches: [agent/validate-runtime-sdk-decouple-v3]

permissions:
  contents: write

concurrency:
  group: agent-runtime-sdk-decouple-v3
  cancel-in-progress: true

env:
  BASE_SHA: fa723c49bc69f927bc222702756d2124151fa962
  CARGO_TERM_COLOR: always

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve transform and publish run id
        shell: bash
        run: |
          cp scripts/agent_runtime_sdk_decouple_v3.py /tmp/agent_runtime_sdk_decouple_v3.py
          python - <<'PY'
          from pathlib import Path

          path = Path('/tmp/agent_runtime_sdk_decouple_v3.py')
          text = path.read_text()
          text = text.replace(
              '    "fn sdk_stem_from_contract_id_pascal(contract_id: &str) -> String {",',
              '    "fn string_literal(value: &str) -> String {",',
              1,
          )
          text = text.replace(
              'rust_codegen = Path("rust/crates/codegen-rust/src/lib.rs")\ntext = rust_codegen.read_text()\n',
              'rust_codegen = Path("rust/crates/codegen-rust/src/lib.rs")\ntext = rust_codegen.read_text()\ntext = text.replace("use serde_json::Value;\\n", "", 1)\n',
              1,
          )
          text = text.replace('api == self.id\n', 'api == self.id.as_str()\n', 1)
          text = text.replace(
              '"        super::rpc::register_auth_rpc_metadata(&mut routes).unwrap();",',
              '"        crate::platform::auth::rpc::register_auth_rpc_metadata(&mut routes).unwrap();",',
              1,
          )
          path.write_text(text)
          PY
          git config user.name trellis-validation
          git config user.email actions@users.noreply.github.com
          printf '%s\n' '${{ github.run_id }}' > .validation-running
          git add .validation-running
          git commit -m 'Record runtime SDK decoupling v3 validation run'
          git push --force origin HEAD:refs/heads/agent/running-runtime-sdk-decouple-v3
          git reset --hard "$BASE_SHA"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.4
      - name: Apply runtime SDK decoupling
        run: python /tmp/agent_runtime_sdk_decouple_v3.py
      - name: Format and check patch
        shell: bash
        run: |
          cargo fmt --manifest-path rust/Cargo.toml --all
          git diff --check
      - name: Prove protocol WASM builds before generated SDKs exist
        shell: bash
        run: |
          rm -rf generated
          cargo check --manifest-path rust/Cargo.toml -p trellis-protocol-wasm --target wasm32-unknown-unknown
      - name: Restore generated baseline
        run: git restore --source="$BASE_SHA" --worktree -- generated
      - name: Regenerate SDKs
        run: cargo run --manifest-path rust/tools/generate/Cargo.toml -- prepare --no-npm .
      - name: Require generated output identity
        run: git diff --exit-code -- generated
      - name: Build embedded portal
        run: deno task -c ts/portals/login/deno.json build:embedded
      - name: Check affected Rust crates
        run: >-
          cargo check --manifest-path rust/Cargo.toml
          -p trellis-protocol
          -p trellis-contracts
          -p trellis-codegen-rust
          -p trellis-codegen-ts
          -p trellis-rs
          -p trellis-runtime
          --all-targets
      - name: Clippy affected Rust crates
        run: >-
          cargo clippy --manifest-path rust/Cargo.toml
          -p trellis-protocol
          -p trellis-contracts
          -p trellis-codegen-rust
          -p trellis-codegen-ts
          -p trellis-rs
          -p trellis-runtime
          --all-targets -- -D warnings
      - name: Test affected Rust libraries
        run: >-
          cargo test --manifest-path rust/Cargo.toml
          -p trellis-protocol
          -p trellis-contracts
          -p trellis-codegen-rust
          -p trellis-codegen-ts
          -p trellis-rs
          -p trellis-runtime
          --lib
      - name: Require generated SDK independence and shared capability lookup
        shell: bash
        run: |
          ! grep -q 'trellis-sdk-' rust/Cargo.toml
          ! grep -q 'trellis-sdk-auth' rust/crates/runtime/Cargo.toml
          ! grep -R -q 'trellis_sdk_auth' rust/crates/runtime/src
          ! grep -q 'fn capability_names(api:' rust/crates/codegen-rust/src/lib.rs
          ! grep -q 'fn capability_names(api:' rust/crates/codegen-ts/src/lib.rs
      - name: Commit validated product source only
        shell: bash
        run: |
          git add -- \
            rust/Cargo.toml \
            rust/crates/runtime/Cargo.toml \
            rust/crates/protocol/src/api.rs \
            rust/crates/contracts/src/lib.rs \
            rust/crates/codegen-rust/src/lib.rs \
            rust/crates/codegen-ts/src/lib.rs \
            rust/crates/trellis/src/service/router.rs \
            rust/crates/runtime/src/platform/auth/rpc/mod.rs \
            rust/crates/runtime/src/platform/auth/verifier.rs
          git diff --cached --check
          git commit -m 'Remove runtime dependency on generated Auth SDK'
          git push --force origin HEAD:refs/heads/agent/result-runtime-sdk-decouple-v3
      - name: Publish failure run id
        if: failure()
        shell: bash
        run: |
          git reset --hard "$BASE_SHA"
          git config user.name trellis-validation
          git config user.email actions@users.noreply.github.com
          printf '%s\n' '${{ github.run_id }}' > .validation-failed
          git add .validation-failed
          git commit -m 'Record failed runtime SDK decoupling v3 validation'
          git push --force origin HEAD:refs/heads/agent/failed-runtime-sdk-decouple-v3
