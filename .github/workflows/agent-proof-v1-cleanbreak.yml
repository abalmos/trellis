name: Agent proof v1 clean break

on:
  push:
    branches:
      - agent/rs-proof-v1-cleanbreak

permissions:
  contents: write

concurrency:
  group: agent-proof-v1-cleanbreak
  cancel-in-progress: true

env:
  DENO_VERSION: 2.9.4
  CARGO_TERM_COLOR: always
  BASE_SHA: fdfa70180a3da1aedc3c117c17c1cfaffba98d61

jobs:
  transform-validate-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish running run id and reset to rs
        shell: bash
        run: |
          git config user.name "trellis-validation"
          git config user.email "actions@users.noreply.github.com"
          printf '%s\n' '${{ github.run_id }}' > .validation-running
          git add .validation-running
          git commit -m "Record proof v1 validation run"
          git push --force origin HEAD:refs/heads/agent/running-proof-v1-cleanbreak
          git reset --hard "$BASE_SHA"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Rename unpublished proof implementation and wire domains
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          replacements = {
              "AUTHORIZATION_REQUEST_PROOF_DOMAIN_V2": "AUTHORIZATION_REQUEST_PROOF_DOMAIN_V1",
              "AUTHORIZATION_EVENT_PROOF_DOMAIN_V2": "AUTHORIZATION_EVENT_PROOF_DOMAIN_V1",
              "AuthorizationRequestProofInputV2": "AuthorizationRequestProofInput",
              "AuthorizationRequestProofV2": "AuthorizationRequestProof",
              "AuthorizationEventProofInputV2": "AuthorizationEventProofInput",
              "AuthorizationEventProofV2": "AuthorizationEventProof",
              "AuthorizationEventPublisherV2": "AuthorizationEventPublisher",
              "VerifiedAuthorizationRequestV2": "VerifiedAuthorizationRequest",
              "VerifiedAuthorizationEventV2": "VerifiedAuthorizationEvent",
              "WireAuthorizationRequestV2": "WireAuthorizationRequest",
              "WireAuthorizationEventV2": "WireAuthorizationEvent",
              "VerifyAuthorizationRequestV2": "VerifyAuthorizationRequest",
              "VerifyAuthorizationEventV2": "VerifyAuthorizationEvent",
              "verifyAuthorizationRequestV2": "verifyAuthorizationRequest",
              "verifyAuthorizationEventV2": "verifyAuthorizationEvent",
              "build_authorization_request_proof_input_v2": "build_authorization_request_proof_input",
              "build_authorization_event_proof_input_v2": "build_authorization_event_proof_input",
              "sign_authorization_request_v2": "sign_authorization_request",
              "sign_authorization_event_v2": "sign_authorization_event",
              "verify_authorization_request_v2": "verify_authorization_request",
              "verify_authorization_event_v2": "verify_authorization_event",
              "create_request_proof_v2": "create_request_proof",
              "create_event_proof_v2": "create_event_proof",
              "verify_event_proof_v2": "verify_event_proof",
              "request_proof_v2": "request_proof",
              "event_proof_v2": "event_proof",
              "verify_v2_signature": "verify_signature",
              "trellis.authorization-request-proof.v2": "trellis.authorization-request-proof.v1",
              "trellis.authorization-event-proof.v2": "trellis.authorization-event-proof.v1",
              "local_authorization_v2_uses_conformance_chain": "local_authorization_uses_conformance_chain",
              "context-bound v2 `proof`": "context-bound `proof`",
              "context-bound v2 event proof": "context-bound event proof",
              "v2 context-bound": "context-bound",
              "request-proof v2": "request-proof",
              "event-proof v2": "event-proof",
              "v2 request proof": "request proof",
              "v2 event proof": "event proof",
              "proof v2": "proof",
          }

          paths = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          changed = []
          for raw in paths:
              if not raw:
                  continue
              path = Path(raw.decode())
              if path.as_posix() == "CLEANUP.md":
                  continue
              try:
                  text = path.read_text()
              except (UnicodeDecodeError, OSError):
                  continue
              original = text
              for old, new in replacements.items():
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text)
                  changed.append(str(path))

          vectors = Path("conformance/authorization-context/vectors.json")
          text = vectors.read_text()
          vector_updates = {
              "requestProofInputHex": "",
              "requestProofDigest": "fHyDchawXxUdjCSg6htzOV04ET9FLKg8E4hBufPfz64",
              "requestProof": "3dsRlkhh_cDiRyrUlKYeVKoYrRnxsxl_9CrvhZOMTrqPnWDcchMAIubEPqW78IL5ABxNqkT1KFlvWjoQSK74Cw",
              "eventProofInputHex": "",
              "eventProofDigest": "Gnrw9PeHuWExhLrBAxQOHcXFEd-9eq9U_UTFWn79ris",
              "eventProof": "v_zQhj4LNAggTfoWqqTvXOgyNeB0UqtRRGxlWKZRBgMJOGJk94uW119bVW3KgkUKLZhBN1dkU53v-OtxacDTBg",
          }
          for name, value in vector_updates.items():
              pattern = rf'("{re.escape(name)}":\s*)"[^"]*"'
              text, count = re.subn(
                  pattern,
                  lambda match, value=value: f'{match.group(1)}"{value}"',
                  text,
                  count=1,
              )
              if count != 1:
                  raise RuntimeError(f"expected exactly one {name} field, found {count}")
          vectors.write_text(text)
          if str(vectors) not in changed:
              changed.append(str(vectors))

          core = Path("rust/crates/trellis/src/client/authorization/core.rs")
          text = core.read_text()
          text = text.replace(
              "PermissionAtomV1, ProtocolError, VerifiedAuthorizationContextV1, VerifiedAuthorizationEvent,\n    VerifiedAuthorizationRequest,",
              "PermissionAtomV1, ProtocolError, VerifiedAuthorizationContextV1,\n    VerifiedAuthorizationEvent as ProtocolVerifiedAuthorizationEvent,\n    VerifiedAuthorizationRequest as ProtocolVerifiedAuthorizationRequest,",
          )
          text = text.replace(
              "    request: VerifiedAuthorizationRequest,",
              "    request: ProtocolVerifiedAuthorizationRequest,",
          )
          text = text.replace(
              "    event: VerifiedAuthorizationEvent,",
              "    event: ProtocolVerifiedAuthorizationEvent,",
          )
          core.write_text(text)

          print("changed files:")
          for path in changed:
              print(path)
          PY

      - name: Prepare repository
        run: cargo run --manifest-path rust/xtask/Cargo.toml -- prepare

      - name: Format Rust
        run: cargo fmt --manifest-path rust/Cargo.toml --all

      - name: Check patch hygiene
        shell: bash
        run: |
          git diff --check
          git diff --exit-code -- CLEANUP.md
          git diff --name-only

      - name: Check production Rust
        run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets --all-features -- -D warnings

      - name: Test Rust libraries
        run: cargo test --manifest-path rust/Cargo.toml --workspace --lib

      - name: Check TypeScript
        run: >-
          deno check -c ts/deno.json
          ts/packages/trellis/index.ts
          ts/packages/trellis-svelte/src/index.ts
          ts/packages/trellis-test/index.ts

      - name: Test authorization conformance in TypeScript and WASM
        run: >-
          deno test -A -c ts/deno.json
          ts/packages/trellis/auth/conformance_test.ts
          ts/packages/trellis/auth/authorization_context_test.ts
          ts/packages/trellis/auth/session_auth_test.ts

      - name: Ensure V2 proof history is gone
        shell: bash
        run: |
          if git grep -n -i -E 'Authorization(Request|Event)[A-Za-z0-9_]*V2|VerifyAuthorization(Request|Event)[A-Za-z0-9_]*V2|authorization_(request|event)[A-Za-z0-9_]*_v2|(request|event)[-_ ]proof[-_ ]*v2|v2[-_ ]*(request|event)[-_ ]proof|trellis\.authorization-(request|event)-proof\.v2|PROOF_DOMAIN_V2|local_authorization_v2' -- ':!CLEANUP.md'; then
            echo "unpublished V2 authorization proof history remains" >&2
            exit 1
          fi

      - name: Commit validated proof clean break
        shell: bash
        run: |
          test -n "$(git diff --name-only)"
          if test -n "$(git ls-files --others --exclude-standard)"; then
            echo "unexpected untracked files remain after prepare" >&2
            git ls-files --others --exclude-standard
            exit 1
          fi
          git config user.name "trellis-validation"
          git config user.email "actions@users.noreply.github.com"
          git diff --name-only -z | xargs -0 git add --
          git commit -m "Make authorization proofs first-public v1"
          git push --force origin HEAD:refs/heads/agent/result-proof-v1-cleanbreak

      - name: Publish failure run id
        if: failure()
        shell: bash
        run: |
          git reset --hard "$BASE_SHA"
          git config user.name "trellis-validation"
          git config user.email "actions@users.noreply.github.com"
          printf '%s\n' '${{ github.run_id }}' > .validation-failed
          git add .validation-failed
          git commit -m "Record failed proof v1 validation"
          git push --force origin HEAD:refs/heads/agent/failed-proof-v1-cleanbreak
