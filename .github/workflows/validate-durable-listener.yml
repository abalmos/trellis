name: Validate Auth fault cleanup

on:
  push:
    branches:
      - agent/validate-durable-listener-v2

permissions:
  contents: write

concurrency:
  group: validate-auth-fault-cleanup
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out validator branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reset to exact rs base
        run: |
          cp .github/scripts/remove_auth_fault_injection.py /tmp/remove_auth_fault_injection.py
          cp .github/scripts/validate_auth_fault_cleanup.sh /tmp/validate_auth_fault_cleanup.sh
          git reset --hard 09125056c5310e9957fc62738767d2f22192db17

      - name: Publish running run id
        run: |
          git config user.name "trellis-validation"
          git config user.email "actions@users.noreply.github.com"
          printf '%s\n' '${{ github.run_id }}' > .validation-running
          git add .validation-running
          git commit -m "Record Auth cleanup validation run"
          git push --force origin HEAD:refs/heads/agent/running-auth-fault-cleanup-v3
          git reset --hard 09125056c5310e9957fc62738767d2f22192db17

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.4

      - name: Cache Rust builds
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            rust -> target
            rust/tools/generate -> target

      - name: Validate Auth cleanup
        run: bash /tmp/validate_auth_fault_cleanup.sh

      - name: Publish failure run id
        if: failure()
        run: |
          git reset --hard 09125056c5310e9957fc62738767d2f22192db17
          git config user.name "trellis-validation"
          git config user.email "actions@users.noreply.github.com"
          printf '%s\n' '${{ github.run_id }}' > .validation-failed
          git add .validation-failed
          git commit -m "Record failed Auth cleanup validation"
          git push --force origin HEAD:refs/heads/agent/failed-auth-fault-cleanup-v3
