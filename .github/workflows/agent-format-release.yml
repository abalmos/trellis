name: Agent format release

on:
  push:
    branches:
      - agent/rs-format-release

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rs-format-release
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Format and test release tooling
        run: |
          set -euo pipefail
          cargo fmt --manifest-path rust/xtask/Cargo.toml
          cargo test --manifest-path rust/xtask/Cargo.toml
          git diff --check

      - name: Commit verified formatting
        run: |
          set -euo pipefail
          git rm .github/workflows/agent-format-release.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/xtask/src/release/mod.rs rust/xtask/src/release/plan.rs rust/xtask/src/release/runner.rs
          git commit -m "Format simplified release tooling"
          git push origin HEAD:agent/rs-format-release
