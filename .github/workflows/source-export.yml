name: Source export

on:
  push:
    branches:
      - agent/rs-source-export
  pull_request:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rs
      - uses: actions/upload-artifact@v4
        with:
          name: rs-source-export
          path: |
            integration/rust-runtime-test-matrix.json
            rust/crates/trellis-test/src/lib.rs
            rust/crates/runtime/src/platform/auth/sqlite/common.rs
            rust/crates/runtime/src/platform/auth_post_commit.rs
            rust/crates/trellis/tests/integration/auth.rs
            rust/crates/trellis/src/service/runtime_facade.rs
            rust/crates/trellis/src/client/authorization/provider_cache.rs
            rust/crates/trellis/src/jobs/runtime_ref.rs
            rust/crates/trellis/src/jobs/manager.rs
