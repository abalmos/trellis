name: Agent self-hosted trigger probe

on:
  push:
    branches:
      - agent/rs-gate-validation

permissions:
  contents: write

concurrency:
  group: agent-self-hosted-trigger-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          ref: agent/wasm-boundary-v3
          fetch-depth: 0

      - name: Record probe run
        shell: bash
        run: |
          set -euo pipefail
          git config user.name trellis-validation
          git config user.email actions@users.noreply.github.com
          printf '%s\n' "$GITHUB_RUN_ID" > .validation-probe-run
          git add .validation-probe-run
          git commit -m 'Record self-hosted validation probe'
          git push origin HEAD:agent/wasm-boundary-v3
