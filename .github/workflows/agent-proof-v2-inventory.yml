name: Agent proof V2 inventory

on:
  push:
    branches:
      - agent/rs-proof-v1

permissions:
  contents: write

jobs:
  inventory:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rs-proof-v1
          fetch-depth: 0
      - name: Record V2 proof references
        shell: bash
        run: |
          set -euo pipefail
          rg -n --hidden --glob '!target/**' --glob '!node_modules/**' \
            'Authorization(Request|Event).*V2|authorization_(request|event).*_v2|AUTHORIZATION_(REQUEST|EVENT)_PROOF_DOMAIN_V2|authorization-(request|event)-proof\.v2|request/event proofs? v2|v2 request/event proofs?' \
            . > .proof-v2-inventory.txt || true
          cat .proof-v2-inventory.txt
      - name: Commit inventory
        run: |
          git rm .github/workflows/agent-proof-v2-inventory.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .proof-v2-inventory.txt
          git commit -m "Inventory unreleased V2 proof references"
          git push origin HEAD:agent/rs-proof-v1
