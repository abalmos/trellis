name: Validate clean xtask prepare ordering

on:
  push:
    branches:
      - agent/fix-xtask-prepare-order-v1

permissions:
  contents: write

concurrency:
  group: agent-fix-xtask-prepare-order-v1
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish running run id
        shell: bash
        run: |
          git config user.name "trellis-validation"
          git config user.email "actions@users.noreply.github.com"
          printf '%s\n' '${{ github.run_id }}' > .validation-running
          git add .validation-running
          git commit -m "Record xtask prepare validation run"
          git push --force origin HEAD:refs/heads/agent/running-xtask-prepare-order-v1
          git reset --hard "$GITHUB_SHA"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.4

      - name: Prepare clean checkout
        run: cargo run --manifest-path rust/xtask/Cargo.toml -- prepare

      - name: Verify preparation outputs and hygiene
        shell: bash
        run: |
          test -f generated/packages/cargo/auth/Cargo.toml
          test -f ts/packages/trellis/auth/protocol_wasm/trellis_protocol_wasm_bg.wasm
          git diff --check
          git diff --quiet -- ts/packages/trellis/auth/protocol_wasm

      - name: Check xtask formatting
        run: cargo fmt --manifest-path rust/xtask/Cargo.toml --check

      - name: Test xtask
        run: cargo test --manifest-path rust/xtask/Cargo.toml

      - name: Publish failure run id
        if: failure()
        shell: bash
        run: |
          git reset --hard "$GITHUB_SHA"
          git config user.name "trellis-validation"
          git config user.email "actions@users.noreply.github.com"
          printf '%s\n' '${{ github.run_id }}' > .validation-failed
          git add .validation-failed
          git commit -m "Record failed xtask prepare validation"
          git push --force origin HEAD:refs/heads/agent/failed-xtask-prepare-order-v1
