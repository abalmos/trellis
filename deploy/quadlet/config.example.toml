instance_name = "Trellis"
event_session_seed_file = "/etc/trellis/secrets/event-session.seed"

[http]
port = 3000
public_origin = "https://auth.example.com"
origins = ["https://app.example.com"]
allow_insecure_origins = []
rate_limit_max = 60
rate_limit_window_ms = 60000

[nats]
servers = "nats"

[nats.runtime]
auth_creds_path = "/run/trellis/creds/auth-trellis.creds"
trellis_creds_path = "/run/trellis/creds/trellis-trellis.creds"
system_creds_path = "/run/trellis/creds/system.creds"

[nats.auth_callout]
issuer_signing_seed_file = "/etc/trellis/secrets/auth-issuer-signing.seed"
target_signing_seed_file = "/etc/trellis/secrets/auth-target-signing.seed"
xkey_seed_file = "/etc/trellis/secrets/auth-xkey.seed"

[auth.authorization]
trust_root_file = "/etc/trellis/trust/authorization-root.json"
issuer_manifest_file = "/etc/trellis/trust/authorization-issuer-manifest.json"
issuer_certificate_files = ["/etc/trellis/trust/authorization-issuer-certificate.json"]
issuer_signing_seed_file = "/etc/trellis/secrets/authorization-issuer.seed"
context_lifetime_seconds = 300
refresh_lead_seconds = 60
refresh_jitter_seconds = 15
minimum_context_lifetime_seconds = 76
maximum_bootstrap_jwt_lifetime_seconds = 3600
cleanup_grace_seconds = 3600
allowed_clock_skew_seconds = 30
maximum_context_bytes = 16384
maximum_permissions = 4096
maximum_capabilities = 256
trust_bucket = "trellis_authorization_trust"
context_bucket = "trellis_authorization_contexts"
registry_replicas = 3

[client]
nats_servers = ["tls://nats.example.com:4222"]
ws_nats_servers = ["wss://nats.example.com:443"]

[leases]
bucket = "trellis_runtime_leases"
replicas = 3
ttl_ms = 9000
renew_ms = 3000

[auth.local_identity]
enabled = true
password_min_length = 12

[oauth]
redirect_base = "https://auth.example.com/auth/callback"
always_show_provider_chooser = false

[platform.storage]
kind = "sqlite"
path = "/var/lib/trellis/trellis.sqlite"
journal_mode = "wal"
busy_timeout_ms = 5000
single_writer = true

[platform.ttl_ms]
sessions = 86400000
oauth = 300000
device_flow = 1800000
pending_auth = 300000
connections = 7200000
nats_jwt = 3600000

[health]
transport_retention_hours = 1
transport_max_bytes = 1073741824

[health.storage]
kind = "sqlite"
path = "/var/lib/trellis/trellis.sqlite"
journal_mode = "wal"
busy_timeout_ms = 5000
single_writer = true

[jobs.storage]
kind = "sqlite"
path = "/var/lib/trellis/trellis.sqlite"
journal_mode = "wal"
busy_timeout_ms = 5000
single_writer = true

[eventlog.storage]
kind = "sqlite"
path = "/var/lib/trellis/trellis.sqlite"
journal_mode = "wal"
busy_timeout_ms = 5000
single_writer = true
