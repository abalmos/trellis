# CASE-OWNED VALIDATION ONLY
extensions:
  health_check:
    endpoint: 127.0.0.1:13133
  file_storage/traces:
    directory: /var/lib/otelcol/trellis-traces
receivers:
  otlp/native:
    protocols:
      http:
        endpoint: 127.0.0.1:4318
  otlp/browser:
    protocols:
      http:
        endpoint: 127.0.0.1:4319
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 384
    spike_limit_mib: 96
  resource/native:
    attributes:
    - key: trellis.telemetry.origin
      value: native
      action: upsert
    - key: trellis.cluster
      value: ${env:TRELLIS_CLUSTER}
      action: upsert
    - key: deployment.environment.name
      value: ${env:TRELLIS_ENVIRONMENT}
      action: upsert
  resource/browser:
    attributes:
    - key: trellis.telemetry.origin
      value: browser
      action: upsert
    - key: trellis.role
      value: browser
      action: upsert
    - key: service.name
      value: trellis-browser
      action: upsert
    - key: service.namespace
      value: trellis
      action: upsert
    - key: trellis.cluster
      value: ${env:TRELLIS_CLUSTER}
      action: upsert
    - key: deployment.environment.name
      value: ${env:TRELLIS_ENVIRONMENT}
      action: upsert
  filter/browser:
    error_mode: ignore
    metrics:
      metric:
      - not (name == "trellis.browser.navigation.duration" or name == "trellis.browser.errors" or name == "trellis.connect.duration" or name == "trellis.rpc.client.duration" or name
        == "trellis.rpc.client.attempts" or name == "trellis.auth.refresh.attempts")
      - resource.attributes["service.instance.id"] == nil or not IsMatch(resource.attributes["service.instance.id"], "^[a-f0-9-]{36}$")
  transform/browser:
    error_mode: ignore
    trace_statements:
    - context: resource
      statements:
      - keep_keys(attributes, ["service.name", "service.namespace", "service.version", "deployment.environment.name", "trellis.cluster", "trellis.role", "trellis.telemetry.origin"])
    - context: span
      statements:
      - keep_keys(attributes, ["trellis.app", "trellis.route", "trellis.outcome", "trellis.operation", "error.type"])
      - set(name, "trellis.browser.observed")
      - set(status.message, "")
    metric_statements:
    - context: resource
      statements:
      - keep_keys(attributes, ["service.name", "service.namespace", "service.instance.id", "deployment.environment.name", "trellis.cluster", "trellis.role", "trellis.telemetry.origin"])
    - context: datapoint
      statements:
      - keep_keys(attributes, ["trellis.app", "trellis.phase", "trellis.outcome", "trellis.kind", "trellis.participant.kind"])
      - set(attributes["trellis.app"], "external") where attributes["trellis.app"] != nil and attributes["trellis.app"] != "console" and attributes["trellis.app"] != "portal"
      - set(attributes["trellis.phase"], "other") where attributes["trellis.phase"] != nil and attributes["trellis.phase"] != "shell" and attributes["trellis.phase"] != "ready" and attributes["trellis.phase"]
        != "bootstrap" and attributes["trellis.phase"] != "nats_connect" and attributes["trellis.phase"] != "total"
      - set(attributes["trellis.outcome"], "other") where attributes["trellis.outcome"] != nil and attributes["trellis.outcome"] != "ok" and attributes["trellis.outcome"] != "error"
        and attributes["trellis.outcome"] != "cancelled"
      - set(attributes["trellis.kind"], "other") where attributes["trellis.kind"] != nil and attributes["trellis.kind"] != "render" and attributes["trellis.kind"] != "http" and attributes["trellis.kind"]
        != "sdk" and attributes["trellis.kind"] != "unhandled"
      - set(attributes["trellis.participant.kind"], "user") where attributes["trellis.participant.kind"] != nil
  batch/native:
    timeout: 1s
    send_batch_size: 512
    send_batch_max_size: 1024
  batch/browser:
    timeout: 2s
    send_batch_size: 128
    send_batch_max_size: 256
exporters:
  prometheus/native:
    endpoint: 127.0.0.1:9464
    translation_strategy: UnderscoreEscapingWithoutSuffixes
    enable_open_metrics: true
    without_scope_info: true
    metric_expiration: 90s
    resource_constant_labels:
      included:
      - service.name
      - service.namespace
      - service.instance.id
      - service.version
      - trellis.cluster
      - deployment.environment.name
      - trellis.role
      - trellis.telemetry.origin
  prometheus/browser:
    endpoint: 127.0.0.1:9465
    translation_strategy: UnderscoreEscapingWithoutSuffixes
    without_scope_info: true
    metric_expiration: 90s
    resource_constant_labels:
      included:
      - service.name
      - service.namespace
      - trellis.cluster
      - deployment.environment.name
      - trellis.role
      - trellis.telemetry.origin
      - service.instance.id
  otlphttp/traces:
    endpoint: ${env:TRELLIS_TRACE_BACKEND}
    timeout: 5s
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 1000
      storage: file_storage/traces
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 15s
      max_elapsed_time: 300s
service:
  extensions:
  - health_check
  - file_storage/traces
  telemetry:
    metrics:
      level: normal
      readers:
      - pull:
          exporter:
            prometheus:
              host: 127.0.0.1
              port: 8888
              without_type_suffix: true
              without_units: true
  pipelines:
    traces/native:
      receivers:
      - otlp/native
      processors:
      - memory_limiter
      - resource/native
      - batch/native
      exporters:
      - otlphttp/traces
    metrics/native:
      receivers:
      - otlp/native
      processors:
      - memory_limiter
      - resource/native
      - batch/native
      exporters:
      - prometheus/native
    traces/browser:
      receivers:
      - otlp/browser
      processors:
      - memory_limiter
      - resource/browser
      - transform/browser
      - batch/browser
      exporters:
      - otlphttp/traces
    metrics/browser:
      receivers:
      - otlp/browser
      processors:
      - memory_limiter
      - resource/browser
      - filter/browser
      - transform/browser
      - batch/browser
      exporters:
      - prometheus/browser
