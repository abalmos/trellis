# Deterministic policy tests. No Trellis instance or machine-speed assertion.
rule_files:
  - recording-rules.yml
  - expected-components.yml
  - alert-rules.yml
evaluation_interval: 30s
tests:
  - name: quiet-consumer-is-not-stalled
    interval: 15s
    input_series:
      - series: 'trellis_consumer_pending{telemetry_pipeline="native",trellis_cluster="example"}'
        values: '0x80'
      - series: 'trellis_consumer_ack_pending{telemetry_pipeline="native",trellis_cluster="example"}'
        values: '0x80'
      - series: 'trellis_consumer_progress_age{telemetry_pipeline="native",trellis_cluster="example"}'
        values: '600x80'
      - series: 'trellis_snapshot_observed_time{telemetry_pipeline="native",trellis_cluster="example",trellis_source="events"}'
        values: '0+15x80'
    alert_rule_test:
      - eval_time: 15m
        alertname: TrellisConsumerStalled
        exp_alerts: []
  - name: stale-snapshot-does-not-assert-current-consumer-stall
    interval: 15s
    input_series:
      - series: 'trellis_consumer_pending{telemetry_pipeline="native",trellis_cluster="example"}'
        values: '10x80'
      - series: 'trellis_consumer_ack_pending{telemetry_pipeline="native",trellis_cluster="example"}'
        values: '0x80'
      - series: 'trellis_consumer_progress_age{telemetry_pipeline="native",trellis_cluster="example"}'
        values: '600x80'
      - series: 'trellis_snapshot_observed_time{telemetry_pipeline="native",trellis_cluster="example",trellis_source="events"}'
        values: '0x80'
    alert_rule_test:
      - eval_time: 15m
        alertname: TrellisConsumerStalled
        exp_alerts: []
  - name: outstanding-work-with-current-snapshot-does-alert
    interval: 15s
    input_series:
      - series: 'trellis_consumer_pending{telemetry_pipeline="native",trellis_cluster="example"}'
        values: '10x80'
      - series: 'trellis_consumer_ack_pending{telemetry_pipeline="native",trellis_cluster="example"}'
        values: '0x80'
      - series: 'trellis_consumer_progress_age{telemetry_pipeline="native",trellis_cluster="example"}'
        values: '600x80'
      - series: 'trellis_snapshot_observed_time{telemetry_pipeline="native",trellis_cluster="example",trellis_source="events"}'
        values: '0+15x80'
    alert_rule_test:
      - eval_time: 15m
        alertname: TrellisConsumerStalled
        exp_alerts:
          - exp_labels: {trellis_cluster: example, severity: warning}
            exp_annotations:
              summary: A Consumer has outstanding work without observed ACK progress
              description: 'Cluster example. Current value: 600. Check telemetry freshness before interpreting last-known gauges.'
              runbook: docs/observability/runbooks.md#consumer-stalled
  - name: dlq-projection-stalled-with-fresh-events-and-stale-sql
    interval: 15s
    input_series:
      - series: 'trellis_projection_pending{telemetry_pipeline="native",trellis_cluster="example",trellis_component="events_dlq"}'
        values: '10x80'
      - series: 'trellis_projection_progress_age{telemetry_pipeline="native",trellis_cluster="example",trellis_component="events_dlq"}'
        values: '600x80'
      - series: 'trellis_snapshot_observed_time{telemetry_pipeline="native",trellis_cluster="example",trellis_source="events"}'
        values: '0+15x80'
      - series: 'trellis_snapshot_observed_time{telemetry_pipeline="native",trellis_cluster="example",trellis_source="events_dlq"}'
        values: '0x80'
      - series: 'trellis_snapshot_observed_time{telemetry_pipeline="native",trellis_cluster="example",trellis_source="jobs"}'
        values: '0+15x80'
      - series: 'trellis_snapshot_observed_time{telemetry_pipeline="native",trellis_cluster="example",trellis_source="health"}'
        values: '0+15x80'
    promql_expr_test:
      - expr: trellis:projection_snapshot_fresh
        eval_time: 15m
        exp_samples:
          - labels: 'trellis:projection_snapshot_fresh{trellis_cluster="example",trellis_source="events",trellis_component="events"}'
            value: 1
          - labels: 'trellis:projection_snapshot_fresh{trellis_cluster="example",trellis_source="events",trellis_component="events_dlq"}'
            value: 1
          - labels: 'trellis:projection_snapshot_fresh{trellis_cluster="example",trellis_source="jobs",trellis_component="jobs"}'
            value: 1
          - labels: 'trellis:projection_snapshot_fresh{trellis_cluster="example",trellis_source="health",trellis_component="health"}'
            value: 1
    alert_rule_test:
      - eval_time: 15m
        alertname: TrellisProjectionStalled
        exp_alerts:
          - exp_labels: {trellis_cluster: example, trellis_component: events_dlq, severity: warning}
            exp_annotations:
              summary: A projector has backlog without observed progress
              description: 'Cluster example. Current value: 600. Check telemetry freshness before interpreting last-known gauges.'
              runbook: docs/observability/runbooks.md#projection-stalled
  - name: dlq-projection-stale-events-fresh-sql-does-not-alert
    interval: 15s
    input_series:
      - series: 'trellis_projection_pending{telemetry_pipeline="native",trellis_cluster="example",trellis_component="events_dlq"}'
        values: '10x80'
      - series: 'trellis_projection_progress_age{telemetry_pipeline="native",trellis_cluster="example",trellis_component="events_dlq"}'
        values: '600x80'
      - series: 'trellis_snapshot_observed_time{telemetry_pipeline="native",trellis_cluster="example",trellis_source="events"}'
        values: '0x80'
      - series: 'trellis_snapshot_observed_time{telemetry_pipeline="native",trellis_cluster="example",trellis_source="events_dlq"}'
        values: '0+15x80'
    promql_expr_test:
      - expr: trellis:projection_snapshot_fresh
        eval_time: 15m
        exp_samples:
          - labels: 'trellis:projection_snapshot_fresh{trellis_cluster="example",trellis_source="events",trellis_component="events"}'
            value: 0
          - labels: 'trellis:projection_snapshot_fresh{trellis_cluster="example",trellis_source="events",trellis_component="events_dlq"}'
            value: 0
    alert_rule_test:
      - eval_time: 15m
        alertname: TrellisProjectionStalled
        exp_alerts: []
  - name: dlq-projection-zero-pending-does-not-alert
    interval: 15s
    input_series:
      - series: 'trellis_projection_pending{telemetry_pipeline="native",trellis_cluster="example",trellis_component="events_dlq"}'
        values: '0x80'
      - series: 'trellis_projection_progress_age{telemetry_pipeline="native",trellis_cluster="example",trellis_component="events_dlq"}'
        values: '600x80'
      - series: 'trellis_snapshot_observed_time{telemetry_pipeline="native",trellis_cluster="example",trellis_source="events"}'
        values: '0+15x80'
    alert_rule_test:
      - eval_time: 15m
        alertname: TrellisProjectionStalled
        exp_alerts: []
  - name: no-reporting-process-does-not-look-healthy
    interval: 15s
    input_series: []
    alert_rule_test:
      - eval_time: 5m
        alertname: TrellisRequiredComponentUnavailable
        exp_alerts:
          - exp_labels: {trellis_cluster: example, trellis_component: platform, severity: critical}
            exp_annotations:
              summary: A configured Trellis component is absent or not healthy
              description: 'Cluster example. Current value: 1. Check telemetry freshness before interpreting last-known gauges.'
              runbook: docs/observability/runbooks.md#component-unavailable
          - exp_labels: {trellis_cluster: example, trellis_component: jobs, severity: critical}
            exp_annotations:
              summary: A configured Trellis component is absent or not healthy
              description: 'Cluster example. Current value: 1. Check telemetry freshness before interpreting last-known gauges.'
              runbook: docs/observability/runbooks.md#component-unavailable
          - exp_labels: {trellis_cluster: example, trellis_component: events, severity: critical}
            exp_annotations:
              summary: A configured Trellis component is absent or not healthy
              description: 'Cluster example. Current value: 1. Check telemetry freshness before interpreting last-known gauges.'
              runbook: docs/observability/runbooks.md#component-unavailable
          - exp_labels: {trellis_cluster: example, trellis_component: health, severity: critical}
            exp_annotations:
              summary: A configured Trellis component is absent or not healthy
              description: 'Cluster example. Current value: 1. Check telemetry freshness before interpreting last-known gauges.'
              runbook: docs/observability/runbooks.md#component-unavailable
