[package]
name = "trellis-generation"
version = "0.12.0"
edition = "2021"
publish = false

[dependencies]
miette = { version = "7.6.0", features = ["fancy"] }
owo-colors = "4.3.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
syn = { version = "2.0.117", features = ["full", "visit"] }
toml = "1.1.2"
tempfile = "3.27.0"
trellis-codegen-rust = { path = "../../crates/codegen-rust" }
trellis-codegen-ts = { path = "../../crates/codegen-ts" }
trellis-contracts = { path = "../../crates/contracts" }
