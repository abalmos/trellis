[workspace]
members = ["device", "service"]
exclude = [
  ".trellis/generated/packages/cargo-participants/demo-device",
  ".trellis/generated/packages/cargo-participants/demo-service",
  ".trellis/generated/packages/cargo/demo-device",
  ".trellis/generated/packages/cargo/demo-service",
  ".trellis/generated/rust/trellis-apis",
]
resolver = "2"

[patch.crates-io]
trellis-contracts = { path = "../../rust/crates/contracts" }
trellis-rs = { path = "../../rust/crates/trellis" }

[workspace.package]
version = "0.12.0"
edition = "2021"
publish = false

[workspace.dependencies]
anyhow = "1.0.100"
async-nats = "0.47.0"
base64 = "0.22.1"
bytes = "1.11.1"
clap = { version = "4.6.0", features = ["derive", "env"] }
futures-util = "0.3.32"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
rand = "0.10.0"
time = { version = "=0.3.46", features = ["formatting"] }
tokio = { version = "1.51.1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
trellis-rs = { path = "../../rust/crates/trellis" }
trellis-apis = { path = ".trellis/generated/rust/trellis-apis" }
trellis-participant-demo-device = { path = ".trellis/generated/packages/cargo-participants/demo-device" }
trellis-participant-demo-service = { path = ".trellis/generated/packages/cargo-participants/demo-service" }
trellis-sdk-demo-service = { path = ".trellis/generated/packages/cargo/demo-service" }
